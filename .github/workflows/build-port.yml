name: build-port-apk

# 1.4.0 基线 + fork 的 root shell / 三档终端权限。
# 本机（aarch64）跑不了 x86_64 的 Flutter/aapt2，所以在 GitHub 上构建并签名。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tooling/**'
      - '.github/workflows/build-port.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache runtime（省掉每次重下 Ubuntu base 与 node）
        uses: actions/cache@v4
        with:
          path: |
            runtime/.cache
            runtime/out
          key: runtime-arm64-${{ runner.os }}-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 安装工具与 NDK（尽力而为，失败只告警）
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq zstd file gpgv xz-utils || true
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          ls "$SDK" 2>/dev/null | head
          ls "$SDK/ndk" 2>/dev/null || echo "no ndk dir yet"
          if ! ls -d "$SDK"/ndk/* >/dev/null 2>&1; then
            ( yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 ) || true
            ( yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "ndk;28.2.13676358" 2>&1 | tail -20 ) || echo "::warning::NDK 安装失败，交给 Gradle 自己解决"
          fi
          NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | head -1)
          echo "NDK_DIR=$NDK_DIR"
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          fi
          true

      - name: 写入签名配置
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_B64:-}" ]; then
            echo "::warning::未配置 RELEASE_KEYSTORE_B64，本次用 debug 签名"
            exit 0
          fi
          mkdir -p app/android/app
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$PWD/app/android/app/release.keystore"
          {
            echo "storeFile=$PWD/app/android/app/release.keystore"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > app/android/key.properties
          test -s app/android/app/release.keystore

      - name: 依赖与静态分析
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/analyze.log
          dart analyze --no-fatal-warnings lib 2>&1 | tee -a /tmp/analyze.log | tail -60

      - name: 构建 arm64 runtime
        run: |
          if [ -f runtime/out/arm64-v8a/assets/runtime/manifest.json ]; then
            echo "runtime 命中缓存，跳过构建"
          else
            set -o pipefail
            bash runtime/build-runtime.sh arm64-v8a 2>&1 | tee /tmp/runtime.log | tail -20
          fi

      - name: 校验 runtime
        run: python3 -I tooling/check_runtime_bundle.py arm64

      - name: 构建 release APK
        shell: bash
        run: |
          set -o pipefail
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --no-companion 2>&1 | tee /tmp/build.log

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/*.apk out/
          cd out && sha256sum ./*.apk > SHA256SUMS && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-port-arm64
          path: |
            out/*.apk
            out/SHA256SUMS
          if-no-files-found: error

      - name: 发布 APK 到 Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "port-${{ github.run_number }}" out/*.apk out/SHA256SUMS \
            --title "dsh-go port build ${{ github.run_number }}" \
            --notes "1.4.0 + fork 三档终端权限（awk/sed 已移出进阶默认）" || \
          gh release upload "port-${{ github.run_number }}" out/*.apk out/SHA256SUMS --clobber

      - name: 失败时发布日志（便于排查）
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "== analyze =="; cat /tmp/analyze.log 2>/dev/null
            echo; echo "== runtime =="; tail -120 /tmp/runtime.log 2>/dev/null
            echo; echo "== build =="; tail -400 /tmp/build.log 2>/dev/null
          } > /tmp/ci.log || true
          gh release create "ci-log-${{ github.run_number }}" /tmp/ci.log \
            --title "CI log ${{ github.run_number }}" --notes "构建失败日志" --latest=false || \
          gh release upload "ci-log-${{ github.run_number }}" /tmp/ci.log --clobber
