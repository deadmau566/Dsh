name: build-port-apk

# 1.4.0 + fork 的 root shell / 三档终端权限，本机 arm64 打不了包，
# 用这里在 GitHub 的 ubuntu-22.04（x86_64）上构建并签名。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tooling/**'
      - '.github/workflows/build-port.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 安装 runtime 构建所需工具
        run: sudo apt-get update && sudo apt-get install -y zstd file gpgv xz-utils

      - name: 写入签名配置
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_B64:-}" ]; then
            # 没配签名 secret 时不中断：key.properties 不写，Gradle 会退回 debug 签名。
            # 这样先能拿到 APK；要长期可覆盖安装，再补 RELEASE_KEYSTORE_B64 重跑一次。
            echo "::warning::未配置 RELEASE_KEYSTORE_B64，本次用 debug 签名（不可用于后续覆盖升级）"
            exit 0
          fi
          mkdir -p app/android/app
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$PWD/app/android/app/release.keystore"
          {
            echo "storeFile=$PWD/app/android/app/release.keystore"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > app/android/key.properties
          "$JAVA_HOME/bin/keytool" -list -v -keystore app/android/app/release.keystore \
            -storepass "$RELEASE_STORE_PASSWORD" | grep -E 'SHA256:|Alias name:' || true

      - name: 构建 arm64 Linux runtime
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: 校验 runtime 包
        run: python3 -I tooling/check_runtime_bundle.py arm64

      - name: 构建 release APK
        run: bash tooling/build-apk.sh -f arm64 --no-companion

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/*.apk out/
          cd out && sha256sum ./*.apk > SHA256SUMS && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-port-arm64
          path: |
            out/*.apk
            out/SHA256SUMS
          if-no-files-found: error
